services:
  web:
    build: .
    env_file: .env
    command: python run_web.py
    ports: ["8000:8000"]
    depends_on: db: {condition: service_healthy}
  bot:
    build: .
    env_file: .env
    command: python run_bot.py
    depends_on: db: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: utilitybot
      POSTGRES_USER: utilitybot
      POSTGRES_PASSWORD: change-me-in-local-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utilitybot -d utilitybot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [utilitybot-db:/var/lib/postgresql/data]
volumes:
  utilitybot-db:
